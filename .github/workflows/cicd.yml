# This is a basic CI/CD workflow to build and deploy a static site to GitHub Pages.
name: Deploy Static Site to GitHub Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: ["Main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single job to build and deploy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out your repository's code so the workflow can access it
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: (Optional) Build step
      # For a simple HTML file, there's no build.
      # For a React/Vue/etc. app, you would run `npm install` and `npm run build` here.
      - name: Build
        run: echo "No build step required for this simple HTML project."

      # Step 3: Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Step 4: Upload the build artifact
      # This action uploads the files that will be deployed.
      # For this project, we just upload the root directory (`.`)
      # For a framework, you'd upload the `build` or `dist` folder.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the entire repository
          path: '.'

      # Step 5: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

